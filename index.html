<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Massa Arena</title>
<style>
*{box-sizing:border-box}html,body,#game{width:100%;height:100%;margin:0;overflow:hidden}body{background:#87c9ef;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 3px #000}
#top{position:absolute;top:18px;left:20px;font-weight:900;font-size:20px}.pill{background:#201c35cc;border:3px solid #fff;border-radius:18px;padding:8px 13px;margin-bottom:8px}
#health{position:absolute;left:22px;bottom:28px;width:260px}.bar{height:16px;background:#4a2735;border:3px solid white;border-radius:10px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:#70e043}
#weapon{position:absolute;right:25px;bottom:20px;text-align:right}.weapon-name{font-size:19px;font-weight:900}.ammo{font-size:42px;font-weight:900;line-height:42px}
#cross{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;filter:drop-shadow(0 1px 2px #000)}#cross:before,#cross:after{content:"";position:absolute;background:white}#cross:before{width:16px;height:3px;top:6px}#cross:after{height:16px;width:3px;left:6px}
#mode{position:absolute;right:22px;top:18px;pointer-events:auto}.btn{border:2px solid white;border-radius:12px;background:#25213dcc;color:white;padding:9px 12px;font-weight:bold;cursor:pointer}
#minimap{position:absolute;right:22px;top:68px;width:130px;height:130px;border:4px solid #fff;border-radius:50%;background:#69a95fbb;overflow:hidden}.mapdot{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 3px #000}
#kills{position:absolute;left:22px;top:70px;font-weight:900;font-size:14px}
#start{position:absolute;inset:0;background:linear-gradient(135deg,#6a43c8cc,#ef7a61cc);display:flex;align-items:center;justify-content:center;pointer-events:auto;text-align:center}.card{background:#241e39e8;border:5px solid white;border-radius:28px;padding:26px 34px;color:white;max-width:520px}.card h1{font-size:52px;margin:0 0 4px;text-shadow:4px 4px #b33aa2}.card p{font-size:17px}.play{border:0;border-radius:14px;padding:16px 44px;background:#ffcf35;color:#33291d;font-size:24px;font-weight:900;box-shadow:0 6px #bd7530;cursor:pointer}
#touch{display:none;position:absolute;inset:0}.stick{position:absolute;bottom:34px;width:150px;height:150px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff22}.stick div{position:absolute;width:62px;height:62px;border-radius:50%;background:#ffffff88;left:44px;top:44px}.stick.left{left:18px}.stick.right{right:18px}.action{position:absolute;right:32px;bottom:198px;width:82px;height:82px;border-radius:50%;border:3px solid white;background:#ffcf35cc;font-weight:bold;color:#33291d}
@media(pointer:coarse){#touch{display:block}#health{bottom:190px;width:190px}.bar{height:14px}#weapon{bottom:190px}}
</style>
</head><body><div id="game"></div>
<div id="hud"><div id="top"><div class="pill">MASSA ARENA</div></div><div id="kills">ELIMINAÇÕES: <span id="killnum">0</span></div><div id="mode"><button class="btn" id="viewBtn">TERCEIRA PESSOA · V</button></div><div id="minimap"></div><div id="cross"></div><div id="health"><div style="font-weight:900;margin-bottom:5px">VIDA <span id="hp">100</span></div><div class="bar"><i id="hpbar"></i></div></div><div id="weapon"><div class="weapon-name" id="wname">PISTOLA MASSA</div><div class="ammo"><span id="ammo">12</span> <small style="font-size:16px">/ ∞</small></div></div>
<div id="touch"><div class="stick left" id="leftstick"><div></div></div><div class="stick right" id="rightstick"><div></div></div><button class="action" id="shootBtn">TIRO</button></div>
<div id="start"><div class="card"><h1>MASSA ARENA</h1><p>Bonecos de massinha • olhos de botão • dinamites<br>WASD move • mouse mira • clique atira • V muda câmera • 1/2/3 troca arma</p><button class="play" id="play">JOGAR</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js';
const C=document.querySelector('#game'), scene=new THREE.Scene();scene.background=new THREE.Color('#82c5ec');scene.fog=new THREE.Fog('#82c5ec',35,85);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;C.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#fff7df','#6b8d68',2));const sun=new THREE.DirectionalLight('#fff5c4',2.5);sun.position.set(-30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=sun.shadow.camera.right=sun.shadow.camera.top=sun.shadow.camera.bottom=40;scene.add(sun);
const tex=new THREE.CanvasTexture((()=>{let c=document.createElement('canvas');c.width=c.height=128;let x=c.getContext('2d');x.fillStyle='#78bd65';x.fillRect(0,0,128,128);x.fillStyle='#66ad56';for(let i=0;i<128;i+=32){for(let j=(i/32%2)*16;j<128;j+=32)x.fillRect(j,i,16,16)}return c})());tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(25,25);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({map:tex,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// arena props
function box(x,z,w,d,h,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
box(0,0,8,8,1.2,'#8b6d50');box(-20,-16,10,3,5,'#e5aa62');box(19,15,12,3,6,'#c99a62');box(25,-20,4,12,4,'#e6bd7a');box(-26,17,4,12,4,'#e6bd7a');
for(let i=-40;i<=40;i+=10){let t=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,3,8),new THREE.MeshStandardMaterial({color:'#795436'}));t.position.set(i,1.5,-42);t.castShadow=true;scene.add(t);let l=new THREE.Mesh(new THREE.SphereGeometry(2,8,6),new THREE.MeshStandardMaterial({color:i%20?'#55a94b':'#78bd65'}));l.position.set(i,4,-42);l.scale.y=.8;scene.add(l)}
const red=new THREE.Color('#ef5350');
function character(color,scale=1){let g=new THREE.Group();let mat=new THREE.MeshStandardMaterial({color,roughness:.65});let body=new THREE.Mesh(new THREE.SphereGeometry(.78*scale,14,10),mat);body.position.y=1.55*scale;body.scale.set(1,.9,.75);body.castShadow=true;g.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(.58*scale,14,10),mat);head.position.y=2.55*scale;head.scale.set(1,.85,1);head.castShadow=true;g.add(head);
for(let s of [-1,1]){let eye=new THREE.Mesh(new THREE.CylinderGeometry(.12*scale,.12*scale,.08*scale,10),new THREE.MeshStandardMaterial({color:'#202020',roughness:.3}));eye.rotation.x=Math.PI/2;eye.position.set(s*.22*scale,2.58*scale,.52*scale);g.add(eye)}
for(let s of [-1,1]){let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.16*scale,.72*scale,5,8),mat);arm.position.set(s*.88*scale,1.55*scale,0);arm.rotation.z=s*.28;arm.castShadow=true;g.add(arm);let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.22*scale,.65*scale,5,8),mat);leg.position.set(s*.34*scale,.55*scale,0);leg.castShadow=true;g.add(leg)}
scene.add(g);g.userData={mat,phase:Math.random()*6,hp:100};return g}
const player=character('#ffcf35',1);player.position.set(0,0,8);let camMode=1,yaw=0,pitch=-.15,health=100,kills=0;
const npcColors=['#ef5350','#56b4ef','#9b67dc','#ef7db7','#50c878','#ff8f45','#c6d6e8'];let npcs=[];for(let i=0;i<7;i++){let n=character(npcColors[i]);n.position.set((Math.random()-.5)*70,0,(Math.random()-.5)*70);n.userData.hp=100;n.userData.respawn=0;npcs.push(n)}
// weapon simple held model
const gun=new THREE.Group();let gmat=new THREE.MeshStandardMaterial({color:'#4b4c58',metalness:.35});let barrel=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.65),gmat);barrel.position.z=-.45;gun.add(barrel);let grip=new THREE.Mesh(new THREE.BoxGeometry(.12,.28,.12),gmat);grip.position.set(0,-.18,-.25);grip.rotation.x=.25;gun.add(grip);camera.add(gun);scene.add(camera);gun.visible=false;
const weapons=[{name:'PISTOLA MASSA',ammo:12,delay:280,color:'#4b4c58'},{name:'ESPINGARDA',ammo:6,delay:650,color:'#6c4a35'},{name:'DINAMITE',ammo:3,delay:850,color:'#f05b45'}];let wi=0,ammo=12,lastShot=0;
function setWeapon(i){wi=i;ammo=weapons[i].ammo;document.querySelector('#wname').textContent=weapons[i].name;document.querySelector('#ammo').textContent=ammo;gun.visible=true}
setWeapon(0);
let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='v')toggleView();if('123'.includes(e.key))setWeapon(+e.key-1)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function toggleView(){camMode=camMode?0:1;document.querySelector('#viewBtn').textContent=camMode?'TERCEIRA PESSOA · V':'PRIMEIRA PESSOA · V';player.visible=!!camMode}
document.querySelector('#viewBtn').onclick=toggleView;
renderer.domElement.onclick=()=>renderer.domElement.requestPointerLock?.();document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch-=e.movementY*.0025;pitch=Math.max(-1.2,Math.min(.7,pitch))}});
function shoot(){let now=performance.now();if(now-lastShot<weapons[wi].delay||ammo<=0)return;lastShot=now;ammo--;document.querySelector('#ammo').textContent=ammo;if(ammo===0)setTimeout(()=>ammo=weapons[wi].ammo,900);
if(wi===2){let d=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.38,10),new THREE.MeshStandardMaterial({color:'#f05b45'}));d.position.copy(camMode?player.position.clone().add(new THREE.Vector3(0,2,0)):camera.position.clone());d.position.y-=.1;scene.add(d);let dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);d.userData={v:dir.multiplyScalar(.28),age:0};throwables.push(d);return}
let dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);const rc=new THREE.Raycaster(camera.position,dir);let hit=rc.intersectObjects(npcs,true)[0];if(hit){let n=npcs.find(x=>x===hit.object||x.children.includes(hit.object)||x.children.some(c=>c.children.includes(hit.object)));if(n){n.userData.hp-=wi===1?55:34;if(n.userData.hp<=0){kills++;document.querySelector('#killnum').textContent=kills;n.visible=false;n.userData.respawn=3}}}}
addEventListener('mousedown',e=>{if(e.button===0)shoot()});
let throwables=[];
const leftStick=document.querySelector('#leftstick'),rightStick=document.querySelector('#rightstick');let moveTouch={x:0,y:0},lookTouch={x:0,y:0};function stick(e,side){let r=e.target.closest('.stick').getBoundingClientRect();let t=e.touches[0],x=(t.clientX-r.left-r.width/2)/(r.width/2),y=(t.clientY-r.top-r.height/2)/(r.height/2);let len=Math.hypot(x,y);if(len>1){x/=len;y/=len}(side==='l'?moveTouch:lookTouch).x=x;(side==='l'?moveTouch:lookTouch).y=y;e.preventTarget?.()}leftStick.addEventListener('touchmove',e=>stick(e,'l'),{passive:false});leftStick.addEventListener('touchend',()=>moveTouch={x:0,y:0});rightStick.addEventListener('touchmove',e=>{e.preventDefault();let r=rightStick.getBoundingClientRect(),t=e.touches[0];yaw-=((t.clientX-r.left-r.width/2)/r.width)*.04;pitch-=((t.clientY-r.top-r.height/2)/r.height)*.04;pitch=Math.max(-1.2,Math.min(.7,pitch))},{passive:false});rightStick.addEventListener('touchend',()=>{});document.querySelector('#shootBtn').addEventListener('touchstart',e=>{e.preventDefault();shoot()},{passive:false});
// minimap
npcs.forEach(n=>{let d=document.createElement('i');d.className='mapdot';d.style.background=n.userData.mat.color.getStyle();n.userData.dot=d;document.querySelector('#minimap').appendChild(d)});
let started=false;document.querySelector('#play').onclick=()=>{document.querySelector('#start').style.display='none';started=true};
const clock=new THREE.Clock();let t=0;
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);t+=dt;if(started){let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)+(-moveTouch.y),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+(moveTouch.x);if(f||s){let len=Math.hypot(f,s);f/=len;s/=len;let speed=camMode?3.8:4.8;let dx=(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed*dt,dz=(Math.cos(yaw)*f-Math.sin(yaw)*s)*speed*dt;player.position.x+=dx;player.position.z+=dz;player.position.x=Math.max(-47,Math.min(47,player.position.x));player.position.z=Math.max(-47,Math.min(47,player.position.z));player.position.y=Math.sin(t*9)*.035;let limbs=player.children.filter(o=>o.geometry?.type==='CapsuleGeometry');limbs.forEach((o,i)=>{if(i<2)o.rotation.z=(i?-.28:.28)+Math.sin(t*9)*.12;else o.rotation.x=Math.sin(t*9+(i%2)*Math.PI)*.22})}player.rotation.y=yaw}
// npc walk and face
npcs.forEach(n=>{if(!n.visible&&n.userData.respawn>0){n.userData.respawn-=dt;if(n.userData.respawn<=0){n.visible=true;n.userData.hp=100;n.position.set((Math.random()-.5)*70,0,(Math.random()-.5)*70)}}if(n.visible){n.userData.phase+=dt*.7;let c=Math.sin(n.userData.phase)*.014;n.position.x+=Math.sin(n.userData.phase*.7)*dt*.8;n.position.z+=Math.cos(n.userData.phase*.4)*dt*.8;n.position.x=Math.max(-47,Math.min(47,n.position.x));n.position.z=Math.max(-47,Math.min(47,n.position.z));n.rotation.y=Math.atan2(player.position.x-n.position.x,player.position.z-n.position.z);n.position.y=c;if(Math.hypot(n.position.x-player.position.x,n.position.z-player.position.z)<1.2&&Math.random()<dt*.3){health-=3;document.querySelector('#hp').textContent=Math.max(0,health);document.querySelector('#hpbar').style.width=Math.max(0,health)+'%';if(health<=0){health=100;player.position.set(0,0,8)}}n.userData.dot.style.left=(50+n.position.x*1.25)+'px';n.userData.dot.style.top=(50+n.position.z*1.25)+'px'}});
throwables.forEach((d,i)=>{d.userData.age+=dt;d.userData.v.y-=.018;d.position.add(d.userData.v);d.rotation.x+=.15;if(d.position.y<.15||d.userData.age>2){let pos=d.position.clone();npcs.forEach(n=>{if(n.visible&&n.position.distanceTo(pos)<4){n.userData.hp-=100;if(n.userData.hp<=0){n.visible=false;n.userData.respawn=3;kills++;document.querySelector('#killnum').textContent=kills}}});scene.remove(d);throwables.splice(i,1)}});
let target=player.position.clone();if(camMode){camera.position.set(target.x-Math.sin(yaw)*6,target.y+3.4-Math.tan(pitch)*2,target.z-Math.cos(yaw)*6)}else camera.position.set(target.x,target.y+2.35,target.z);camera.rotation.set(pitch,yaw,0);gun.position.set(.42,-.32,-.75);gun.rotation.set(.05,0,-.02);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
